plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "ResonantInduction-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            jvmArguments.addAll('-Xmx2G', '-XX:+UseG1GC')
        }
        client {
            client()
            gameDirectory = file('runs/client')
            programArguments.addAll('--width', '854', '--height', '480')
        }
        server {
            server()
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
        // Headless dedicated server that runs the GameTests and exits (EULA auto-accepted).
        // -PgametestDir=gametest-voltz runs it with the pack's server-side mods staged in runs/gametest-voltz/mods.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file("runs/${findProperty('gametestDir') ?: 'gametest'}")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (findProperty('devXmx')) {
                jvmArguments.add("-Xmx${findProperty('devXmx')}")
            }
        }
        data {
            data()
            gameDirectory = file('runs/data')
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}
